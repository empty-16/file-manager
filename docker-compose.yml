services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: file-manager-dev:latest
    container_name: file-manager-dev
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
    ipc: host
    stdin_open: true
    tty: true
    working_dir: /workspace
    command: ["bash"]
